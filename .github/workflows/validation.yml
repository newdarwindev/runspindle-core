# Mandatory checks are assigned exactly once in validation-partitions.json.
# Missing, failed, cancelled or mismatched receipts keep the required gate red.
name: validation
on:
  push:
    branches: [main, 'ci/*']
permissions:
  contents: read
concurrency:
  group: strix-direct-v1-${{ github.ref }}
  cancel-in-progress: false
jobs:
  quality:
    name: validation / quality
    runs-on: ["${{ format('runspindle-strix-direct-{0}-{1}-quality', github.run_id, github.run_attempt) }}"]
    timeout-minutes: 15
    outputs:
      receipt: ${{ steps.partition.outputs.receipt }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - id: partition
        name: Run quality partition
        run: python3 tools/partition_validation.py quality --output "$GITHUB_OUTPUT"
  component:
    name: validation / component
    runs-on: ["${{ format('runspindle-strix-direct-{0}-{1}-component', github.run_id, github.run_attempt) }}"]
    timeout-minutes: 15
    outputs:
      receipt: ${{ steps.partition.outputs.receipt }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - id: partition
        name: Run component partition
        run: python3 tools/partition_validation.py component --output "$GITHUB_OUTPUT"
  rust:
    name: validation / rust
    runs-on: ["${{ format('runspindle-strix-direct-{0}-{1}-rust', github.run_id, github.run_attempt) }}"]
    timeout-minutes: 15
    outputs:
      receipt: ${{ steps.partition.outputs.receipt }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - id: partition
        name: Run rust partition
        run: python3 tools/partition_validation.py rust --output "$GITHUB_OUTPUT"
  mutation_1:
    name: validation / mutation_1
    runs-on: ["${{ format('runspindle-strix-direct-{0}-{1}-mutation_1', github.run_id, github.run_attempt) }}"]
    timeout-minutes: 15
    outputs:
      receipt: ${{ steps.partition.outputs.receipt }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - id: partition
        name: Run mutation_1 partition
        run: python3 tools/partition_validation.py mutation_1 --output "$GITHUB_OUTPUT"
  auth_1:
    name: validation / auth_1
    runs-on: ["${{ format('runspindle-strix-direct-{0}-{1}-auth_1', github.run_id, github.run_attempt) }}"]
    timeout-minutes: 23
    outputs:
      receipt: ${{ steps.shard.outputs.receipt }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - id: shard
        name: Run authenticated artifact mutation shard 1
        run: |
          python3 -c 'from tools.partition_validation import manifests, guest_identity; guest_identity(manifests()[0]["image"])'
          receipt="$(python3 tools/check_authenticated_artifact_mutations.py --shard 1)"
          printf 'receipt=%s\n' "$receipt" >> "$GITHUB_OUTPUT"
  auth_2:
    name: validation / auth_2
    runs-on: ["${{ format('runspindle-strix-direct-{0}-{1}-auth_2', github.run_id, github.run_attempt) }}"]
    timeout-minutes: 23
    outputs:
      receipt: ${{ steps.shard.outputs.receipt }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - id: shard
        name: Run authenticated artifact mutation shard 2
        run: |
          python3 -c 'from tools.partition_validation import manifests, guest_identity; guest_identity(manifests()[0]["image"])'
          receipt="$(python3 tools/check_authenticated_artifact_mutations.py --shard 2)"
          printf 'receipt=%s\n' "$receipt" >> "$GITHUB_OUTPUT"
  auth_3:
    name: validation / auth_3
    runs-on: ["${{ format('runspindle-strix-direct-{0}-{1}-auth_3', github.run_id, github.run_attempt) }}"]
    timeout-minutes: 23
    outputs:
      receipt: ${{ steps.shard.outputs.receipt }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - id: shard
        name: Run authenticated artifact mutation shard 3
        run: |
          python3 -c 'from tools.partition_validation import manifests, guest_identity; guest_identity(manifests()[0]["image"])'
          receipt="$(python3 tools/check_authenticated_artifact_mutations.py --shard 3)"
          printf 'receipt=%s\n' "$receipt" >> "$GITHUB_OUTPUT"
  auth_4:
    name: validation / auth_4
    runs-on: ["${{ format('runspindle-strix-direct-{0}-{1}-auth_4', github.run_id, github.run_attempt) }}"]
    timeout-minutes: 23
    outputs:
      receipt: ${{ steps.shard.outputs.receipt }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - id: shard
        name: Run authenticated artifact mutation shard 4
        run: |
          python3 -c 'from tools.partition_validation import manifests, guest_identity; guest_identity(manifests()[0]["image"])'
          receipt="$(python3 tools/check_authenticated_artifact_mutations.py --shard 4)"
          printf 'receipt=%s\n' "$receipt" >> "$GITHUB_OUTPUT"
  auth_5:
    name: validation / auth_5
    runs-on: ["${{ format('runspindle-strix-direct-{0}-{1}-auth_5', github.run_id, github.run_attempt) }}"]
    timeout-minutes: 23
    outputs:
      receipt: ${{ steps.shard.outputs.receipt }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - id: shard
        name: Run authenticated artifact mutation shard 5
        run: |
          python3 -c 'from tools.partition_validation import manifests, guest_identity; guest_identity(manifests()[0]["image"])'
          receipt="$(python3 tools/check_authenticated_artifact_mutations.py --shard 5)"
          printf 'receipt=%s\n' "$receipt" >> "$GITHUB_OUTPUT"
  mutation_2:
    needs: [auth_1, auth_2, auth_3, auth_4, auth_5]
    name: validation / mutation_2
    runs-on: ["${{ format('runspindle-strix-direct-{0}-{1}-mutation_2', github.run_id, github.run_attempt) }}"]
    timeout-minutes: 15
    outputs:
      receipt: ${{ steps.partition.outputs.receipt }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - id: partition
        name: Run mutation_2 partition
        env:
          RUNSPINDLE_AUTH_SHARDS: "1"
          RUNSPINDLE_AUTH_SHARD_1: ${{ needs.auth_1.outputs.receipt }}
          RUNSPINDLE_AUTH_SHARD_2: ${{ needs.auth_2.outputs.receipt }}
          RUNSPINDLE_AUTH_SHARD_3: ${{ needs.auth_3.outputs.receipt }}
          RUNSPINDLE_AUTH_SHARD_4: ${{ needs.auth_4.outputs.receipt }}
          RUNSPINDLE_AUTH_SHARD_5: ${{ needs.auth_5.outputs.receipt }}
        run: python3 tools/partition_validation.py mutation_2 --output "$GITHUB_OUTPUT"
  mutation_3:
    name: validation / mutation_3
    runs-on: ["${{ format('runspindle-strix-direct-{0}-{1}-mutation_3', github.run_id, github.run_attempt) }}"]
    timeout-minutes: 15
    outputs:
      receipt: ${{ steps.partition.outputs.receipt }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - id: partition
        name: Run mutation_3 partition
        run: python3 tools/partition_validation.py mutation_3 --output "$GITHUB_OUTPUT"
  mutation_4:
    name: validation / mutation_4
    runs-on: ["${{ format('runspindle-strix-direct-{0}-{1}-mutation_4', github.run_id, github.run_attempt) }}"]
    timeout-minutes: 15
    outputs:
      receipt: ${{ steps.partition.outputs.receipt }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - id: partition
        name: Run mutation_4 partition
        run: python3 tools/partition_validation.py mutation_4 --output "$GITHUB_OUTPUT"
  strix-linux-x64:
    name: validation / strix-linux-x64
    if: ${{ always() }}
    needs: [quality, component, rust, mutation_1, mutation_2, mutation_3, mutation_4]
    runs-on: ["${{ format('runspindle-strix-direct-{0}-{1}-strix-linux-x64', github.run_id, github.run_attempt) }}"]
    timeout-minutes: 5
    env:
      RECEIPT_QUALITY: ${{ needs.quality.outputs.receipt }}
      RESULT_QUALITY: ${{ needs.quality.result }}
      RECEIPT_COMPONENT: ${{ needs.component.outputs.receipt }}
      RESULT_COMPONENT: ${{ needs.component.result }}
      RECEIPT_RUST: ${{ needs.rust.outputs.receipt }}
      RESULT_RUST: ${{ needs.rust.result }}
      RECEIPT_MUTATION_1: ${{ needs.mutation_1.outputs.receipt }}
      RESULT_MUTATION_1: ${{ needs.mutation_1.result }}
      RECEIPT_MUTATION_2: ${{ needs.mutation_2.outputs.receipt }}
      RESULT_MUTATION_2: ${{ needs.mutation_2.result }}
      RECEIPT_MUTATION_3: ${{ needs.mutation_3.outputs.receipt }}
      RESULT_MUTATION_3: ${{ needs.mutation_3.result }}
      RECEIPT_MUTATION_4: ${{ needs.mutation_4.outputs.receipt }}
      RESULT_MUTATION_4: ${{ needs.mutation_4.result }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify exact partition coverage and image binding
        run: python3 tools/partition_validation.py aggregate
