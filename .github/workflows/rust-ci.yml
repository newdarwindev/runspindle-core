# Configured checks: structure plus synthetic Rust component contracts.
# Requires a pre-provisioned qualified local toolchain. No install or fallback.
# Workflow configuration is not evidence of a CI run or product acceptance.
name: rust-ci
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  component-contracts:
    runs-on: [self-hosted, linux, x64, runspindle-isolated]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate scaffold only
        run: python3 tools/check_scaffold.py
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Test synthetic component contracts offline
        run: cargo test --offline --all-targets
      - name: Lint component contracts offline
        run: cargo clippy --offline --all-targets -- -D warnings
